function tierForRating(r) {
  if (r >= 90) return "Icon";
  if (r >= 84) return "Elite";
  if (r >= 78) return "Star";
  if (r >= 70) return "Quality";
  return "Rotation";
}
const TIER_COLOR = {
  Icon: "#E8B23D", Elite: "#8B7BE8", Star: "#3FA796", Quality: "#4C8BF5", Rotation: "#7A8399",
};
const POS_COLOR = { GK: "#D9A441", DEF: "#3FA796", MID: "#5B6EE8", FWD: "#D6455E" };
const POS_LABEL = { GK: "Goalkeeper", DEF: "Defender", MID: "Midfielder", FWD: "Forward" };

// Auction base price (£M). Mildly convex in rating (top Icons cost more
// per point than mid-table Quality players do) but capped well short of
// the old curve, which let a single Icon eat ~30% of a full budget on its
// own. Calibrated against the actual 163-player pool (ratings 76-98, mean
// ~85.5): an "average" full XI now costs roughly a full default budget
// (~£550M for 11 players), not 2-3x it — buying a genuine Icon (98) costs
// about 2x an average XI slot, not 6-7x.
function basePriceForRating(r) {
  const t = Math.max(0, Math.min(1, (r - 58) / (99 - 58)));
  const price = 1.5 + Math.pow(t, 1.7) * 93.5;
  return Math.max(1.5, Math.round(price * 2) / 2);
}

/* =========================================================================
   SQUAD RULES
========================================================================= */
const SQUAD_SIZE = 11;
const MIN_PRICE_FLOOR = 1.5;
const LOT_DURATION_MS = 8000;

// Each manager locks in a formation before the auction starts, which sets
// the EXACT position shape their 11 must fill (not just minimums — a
// 3-5-2 squad has exactly 3 defenders, never 4). In the match engine each
// formation trades attack strength for defense (or vice versa) or lets a
// strong midfield lift both ends a little — tuned via Monte Carlo
// (tune-formations.js) so no formation dominates in a fair fight; the
// real reward for matching a formation to your squad is economic: it
// lets you commit auction budget to the positions that formation plays
// more of, instead of splitting money across a shape you didn't want.
const FORMATIONS = {
  "4-4-2": { label: "4-4-2", tag: "Balanced", counts: { GK: 1, DEF: 4, MID: 4, FWD: 2 }, attackMult: 1.0, defenseMult: 1.0, desc: "No bonus, no penalty — even spread across the pitch." },
  "4-3-3": { label: "4-3-3", tag: "Attacking", counts: { GK: 1, DEF: 4, MID: 3, FWD: 3 }, attackMult: 1.07, defenseMult: 0.93, desc: "+7% attack, -7% defense — three forwards, go for goals." },
  "5-3-2": { label: "5-3-2", tag: "Defensive", counts: { GK: 1, DEF: 5, MID: 3, FWD: 2 }, attackMult: 0.93, defenseMult: 1.07, desc: "+7% defense, -7% attack — five at the back, hard to beat." },
  "3-5-2": { label: "3-5-2", tag: "Midfield Control", counts: { GK: 1, DEF: 3, MID: 5, FWD: 2 }, midControl: 0.05, desc: "A strong midfield lifts both ends slightly — thin at the back." },
  "4-2-3-1": { label: "4-2-3-1", tag: "Possession", counts: { GK: 1, DEF: 4, MID: 5, FWD: 1 }, midControl: 0.04, desc: "Extra midfielder for control, a lone striker leads the line." },
};
const DEFAULT_FORMATION = "4-4-2";

function positionCounts(squad) {
  const c = { GK: 0, DEF: 0, MID: 0, FWD: 0 };
  squad.forEach((p) => c[p.position]++);
  return c;
}
// Whether `manager` can legally place a bid of `amount` for `player` given
// their current squad/budget and formation shape — checks that this
// position's exact quota isn't already full, budget, and that enough
// slots + money remain afterward to still fill every other required
// position (so a manager can never bid themselves into an unfillable
// squad for the formation they picked).
function canBid(squad, budget, player, amount, counts) {
  if (squad.length >= SQUAD_SIZE) return false;
  const c = positionCounts(squad);
  if (c[player.position] >= counts[player.position]) return false;
  if (amount > budget + 1e-9) return false;
  const hypothetical = [...squad, player];
  const hc = positionCounts(hypothetical);
  const neededAfter = Object.keys(counts).reduce((s, pos) => s + Math.max(0, counts[pos] - hc[pos]), 0);
  const slotsLeftAfter = SQUAD_SIZE - hypothetical.length;
  if (slotsLeftAfter < neededAfter) return false;
  const budgetAfter = budget - amount;
  if (budgetAfter < slotsLeftAfter * MIN_PRICE_FLOOR - 1e-9) return false;
  return true;
}
function squadIsComplete(squad, counts) {
  if (squad.length !== SQUAD_SIZE) return false;
  const c = positionCounts(squad);
  return Object.keys(counts).every((pos) => c[pos] >= counts[pos]);
}

function bidIncrement(amount) {
  if (amount < 10) return 0.5;
  if (amount < 50) return 1;
  if (amount < 100) return 2.5;
  return 5;
}
function nextBidAmount(currentBid, basePrice) {
  if (currentBid == null) return basePrice;
  return Math.round((currentBid + bidIncrement(currentBid)) * 2) / 2;
}
function fmtM(n) {
  if (n == null) return "—";
  return "£" + (Math.round(n * 10) / 10).toFixed(n % 1 === 0 ? 0 : 1) + "M";
}
function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}
function round1(n) {
  return Math.round(n * 10) / 10;
}

// Deterministic per-player "sub-stats" (seeded on the player's id, so
// they're stable across renders/sessions rather than reshuffling) that
// break the single overall rating into a small position-appropriate
// profile — gives bidders more to weigh than one number. Averages back
// out close to the overall rating; not a second data source, just a
// readable decomposition of it.
function seededRand(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
const STAT_PROFILES = {
  GK: { REF: 6, HAN: 2, KIC: -3, POS: 3 },
  DEF: { PAC: -3, ATT: -15, PAS: 0, DEF: 11 },
  MID: { PAC: -1, ATT: -4, PAS: 9, DEF: 2 },
  FWD: { PAC: 6, ATT: 11, PAS: -3, DEF: -15 },
};
function detailedStats(player) {
  const rand = seededRand(player.id * 9301 + 49297);
  const profile = STAT_PROFILES[player.position];
  const stats = {};
  Object.keys(profile).forEach((k) => {
    const jitter = Math.round((rand() - 0.5) * 8);
    stats[k] = Math.max(35, Math.min(99, Math.round(player.rating + profile[k] + jitter)));
  });
  return stats;
}
const STAT_LABEL = { REF: "Reflexes", HAN: "Handling", KIC: "Kicking", POS: "Positioning", PAC: "Pace", ATT: "Attack", PAS: "Passing", DEF: "Defending" };

/* =========================================================================
   LEAGUE / MATCH SIMULATION
========================================================================= */
// A line's rating is a blend of a power-mean over its players (rewards
// squad depth — several good players beats one great one propped up by
// scrubs) and its single best player (guarantees one marquee auction
// buy is always clearly felt, not diluted away by 2-3 average
// teammates). Tuned via Monte Carlo simulation (see project notes): with
// this blend, swapping one weak player for one Icon produces roughly the
// same match impact as upgrading a whole tier's worth of squad depth —
// which is what "the auction result should matter" means in practice.
const LINE_POWER = 1.5;
const BEST_PLAYER_WEIGHT = 0.4;
function powerMean(ratings, p) {
  if (!ratings.length) return 62;
  let numer = 0, denom = 0;
  ratings.forEach((r) => { const w = Math.pow(r, p); numer += w * r; denom += w; });
  return numer / denom;
}
function lineRating(ratings) {
  if (!ratings.length) return 62;
  const pm = powerMean(ratings, LINE_POWER);
  const best = Math.max(...ratings);
  return pm * (1 - BEST_PLAYER_WEIGHT) + best * BEST_PLAYER_WEIGHT;
}
function teamRatings(squad, formationKey) {
  const gk = squad.find((p) => p.position === "GK");
  const def = squad.filter((p) => p.position === "DEF").map((p) => p.rating);
  const mid = squad.filter((p) => p.position === "MID").map((p) => p.rating);
  const fwd = squad.filter((p) => p.position === "FWD").map((p) => p.rating);
  const fwdLine = lineRating(fwd);
  const midLine = lineRating(mid);
  const defLine = lineRating(def);
  const gkLine = gk ? gk.rating : 62;
  let attack = fwdLine * 0.6 + midLine * 0.4;
  let defense = defLine * 0.65 + gkLine * 0.35;
  const f = FORMATIONS[formationKey] || FORMATIONS[DEFAULT_FORMATION];
  if (f.attackMult) attack *= f.attackMult;
  if (f.defenseMult) defense *= f.defenseMult;
  if (f.midControl) {
    const bonus = (midLine - 78) * f.midControl;
    attack += bonus;
    defense += bonus * 0.8;
  }
  const overall = squad.length ? squad.reduce((s, p) => s + p.rating, 0) / squad.length : 62;
  return { attack, defense, overall };
}
function expectedGoals(myAttack, oppDefense, isHome) {
  const diff = myAttack - oppDefense;
  let xg = 1.3 + diff / 15;
  if (isHome) xg += 0.18;
  return Math.max(0.1, xg);
}
// Knuth's Poisson sampler — gives a realistic scatter of scorelines around
// the expected-goals value instead of always rounding to the same number.
function poissonSample(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}
function pickScorer(squad) {
  const eligible = squad.filter((p) => p.position === "FWD" || p.position === "MID");
  const pool = eligible.length ? eligible : squad;
  const weights = pool.map((p) => Math.pow(1.06, p.rating));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
function simulateFixture(homeSquad, awaySquad, homeName, awayName, homeFormation, awayFormation) {
  const h = teamRatings(homeSquad, homeFormation), a = teamRatings(awaySquad, awayFormation);
  const hxg = expectedGoals(h.attack, a.defense, true);
  const axg = expectedGoals(a.attack, h.defense, false);
  const homeGoals = poissonSample(hxg);
  const awayGoals = poissonSample(axg);
  const log = [];
  const events = [];
  for (let i = 0; i < homeGoals; i++) events.push({ side: "home", minute: 1 + Math.floor(Math.random() * 89), scorer: pickScorer(homeSquad) });
  for (let i = 0; i < awayGoals; i++) events.push({ side: "away", minute: 1 + Math.floor(Math.random() * 89), scorer: pickScorer(awaySquad) });
  events.sort((x, y) => x.minute - y.minute);
  events.forEach((e) => {
    const team = e.side === "home" ? homeName : awayName;
    log.push(`⚽ ${e.minute}' — ${e.scorer.name} scores for ${team}!`);
  });
  if (!events.length) log.push("A goalless stalemate — both defenses held firm.");
  log.push(`Full time: ${homeName} ${homeGoals} - ${awayGoals} ${awayName}`);
  return { homeGoals, awayGoals, log };
}
// Circle-method double round robin: every pair of teams meets twice (home
// & away), matching a real league season rather than a knockout bracket.
function generateFixtures(teamIds) {
  const ids = [...teamIds];
  const hasBye = ids.length % 2 !== 0;
  if (hasBye) ids.push(null);
  const n = ids.length;
  const rounds = [];
  const arr = [...ids];
  for (let r = 0; r < n - 1; r++) {
    const round = [];
    for (let i = 0; i < n / 2; i++) {
      const t1 = arr[i], t2 = arr[n - 1 - i];
      if (t1 != null && t2 != null) round.push(r % 2 === 0 ? [t1, t2] : [t2, t1]);
    }
    rounds.push(round);
    arr.splice(1, 0, arr.pop());
  }
  const fixtures = [];
  let id = 0;
  rounds.forEach((round) => round.forEach(([home, away]) => {
    fixtures.push({ id: `f${id++}`, home, away, leg: 1, played: false, homeGoals: null, awayGoals: null, log: [] });
  }));
  rounds.forEach((round) => round.forEach(([home, away]) => {
    fixtures.push({ id: `f${id++}`, home: away, away: home, leg: 2, played: false, homeGoals: null, awayGoals: null, log: [] });
  }));
  return fixtures;
}
function computeTable(teamIds, fixtures) {
  const table = {};
  teamIds.forEach((t) => (table[t] = { id: t, played: 0, won: 0, draw: 0, lost: 0, gf: 0, ga: 0, pts: 0 }));
  fixtures.filter((f) => f.played).forEach((f) => {
    const h = table[f.home], a = table[f.away];
    if (!h || !a) return;
    h.played++; a.played++;
    h.gf += f.homeGoals; h.ga += f.awayGoals;
    a.gf += f.awayGoals; a.ga += f.homeGoals;
    if (f.homeGoals > f.awayGoals) { h.won++; h.pts += 3; a.lost++; }
    else if (f.homeGoals < f.awayGoals) { a.won++; a.pts += 3; h.lost++; }
    else { h.draw++; a.draw++; h.pts += 1; a.pts += 1; }
  });
  return Object.values(table).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
}

/* =========================================================================
   AI MANAGER LOGIC — runs entirely client-side, on whichever connected
   browser tab's poll tick happens to notice it's the AI's move, and writes
   through the same commit path a human action would. No server game logic
   exists; this mirrors how the sibling draft-battle games run their bots.
========================================================================= */
const AI_NAMES = ["Gaffer Bot", "Tactics Bot", "Scout Bot", "Ledger Bot", "Rotation Bot", "Wildcard Bot"];
function randomFormationKey() {
  const keys = Object.keys(FORMATIONS);
  return keys[Math.floor(Math.random() * keys.length)];
}
function aiWillingness(manager, squad, player, counts) {
  const c = positionCounts(squad);
  const underMin = (counts[player.position] || 0) > c[player.position];
  const needMultiplier = underMin ? 1.35 : squad.length < SQUAD_SIZE * 0.6 ? 1.05 : 0.75;
  const randomFactor = 1.1 + Math.random() * 0.55;
  return player.basePrice * needMultiplier * randomFactor;
}
function aiDecision(manager, squad, budget, player, currentBid, basePrice, counts) {
  const amount = nextBidAmount(currentBid, basePrice);
  if (!canBid(squad, budget, player, amount, counts)) return null;
  const willingness = aiWillingness(manager, squad, player, counts);
  if (amount > willingness) return null;
  if (Math.random() < 0.12) return null; // occasional early pass keeps AI unpredictable
  return amount;
}

/* =========================================================================
   SHARED STATE (server-backed KV store, polling sync)
========================================================================= */
async function storageGet(key, shared = true) {
  try {
    if (!shared) {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
    const res = await fetch(`/api/kv/${encodeURIComponent(key)}`);
    if (res.status === 404) return null;
    if (!res.ok) return null;
    const r = await res.json();
    return r && r.value !== undefined ? JSON.parse(r.value) : null;
  } catch { return null; }
}
async function storageSet(key, value, shared = true) {
  try {
    if (!shared) { localStorage.setItem(key, JSON.stringify(value)); return; }
    await fetch(`/api/kv/${encodeURIComponent(key)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: JSON.stringify(value) }),
    });
  } catch (e) { console.error("storage set failed", e); }
}
async function commitIfRevMatches(key, fresh, updated) {
  const check = await storageGet(key);
  if (!check || check.rev !== fresh.rev) return false;
  await storageSet(key, updated);
  return true;
}
const roomKey = (code) => `pla-room-${code}`;
const PERSONAL_ID_KEY = "pla-my-id";
const PERSONAL_NAME_KEY = "pla-my-name";
const ACTIVE_ROOM_KEY = "pla-active-room";

function genCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 5; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
function genId() {
  return "p" + Math.random().toString(36).slice(2, 10);
}
const MANAGER_COLORS = ["#D64545", "#3FA796", "#4C8BF5", "#E8B23D", "#8B7BE8", "#D6816B", "#5FC48D", "#E86BA8", "#6BA8E8", "#C9A227"];

function makeLot(footballerId, lotNumber) {
  const player = PLAYERS_BY_ID[footballerId];
  return {
    footballerId, lotNumber,
    basePrice: player.basePrice,
    currentBid: null,
    currentBidderId: null,
    passed: [],
    deadlineTs: Date.now() + LOT_DURATION_MS,
  };
}

function resolveLot(room) {
  const lot = room.currentLot;
  const player = PLAYERS_BY_ID[lot.footballerId];
  const squads = { ...room.squads };
  const remainingBudget = { ...room.remainingBudget };
  const soldLog = [...room.soldLog];
  let unsoldIds = [...room.unsoldIds];
  if (lot.currentBidderId) {
    const buyer = lot.currentBidderId;
    squads[buyer] = [...(squads[buyer] || []), player];
    remainingBudget[buyer] = round1(remainingBudget[buyer] - lot.currentBid);
    soldLog.unshift({ footballerId: player.id, buyerId: buyer, price: lot.currentBid, lotNumber: lot.lotNumber });
  } else {
    unsoldIds.push(player.id);
    soldLog.unshift({ footballerId: player.id, buyerId: null, price: null, lotNumber: lot.lotNumber });
  }
  return { ...room, squads, remainingBudget, soldLog, unsoldIds };
}
// Every manager's formation counts, keyed by id — falls back to the
// default formation for anyone who somehow has none set (shouldn't
// happen once the lobby always seeds one on join).
function countsFor(room, managerId) {
  const key = (room.formations && room.formations[managerId]) || DEFAULT_FORMATION;
  return FORMATIONS[key].counts;
}
// Absolute safety net: if the pool (plus recycled unsold lots) runs dry
// before every squad is full, force-fill remaining slots from whatever
// eligible players are left so no manager gets stuck with an invalid team.
function forceFillIncompleteSquads(room) {
  let squads = { ...room.squads };
  let remainingBudget = { ...room.remainingBudget };
  const ownedIds = new Set(Object.values(squads).flat().map((p) => p.id));
  room.players.forEach((m) => {
    let squad = squads[m.id] || [];
    let budget = remainingBudget[m.id] || 0;
    const counts = countsFor(room, m.id);
    let guard = 0;
    while (!squadIsComplete(squad, counts) && squad.length < SQUAD_SIZE && guard < 400) {
      guard++;
      const c = positionCounts(squad);
      const neededPos = Object.keys(counts).find((pos) => c[pos] < counts[pos]) || "DEF";
      const candidate = PLAYERS.filter((p) => !ownedIds.has(p.id) && p.position === neededPos)
        .sort((a, b) => a.basePrice - b.basePrice)[0]
        || PLAYERS.filter((p) => !ownedIds.has(p.id)).sort((a, b) => a.basePrice - b.basePrice)[0];
      if (!candidate) break;
      ownedIds.add(candidate.id);
      const price = Math.min(candidate.basePrice, Math.max(0, budget));
      squad = [...squad, candidate];
      budget = round1(budget - price);
    }
    squads[m.id] = squad;
    remainingBudget[m.id] = budget;
  });
  return { ...room, squads, remainingBudget };
}
function advanceAuction(room) {
  let updated = resolveLot(room);
  const allFull = updated.players.every((m) => squadIsComplete(updated.squads[m.id] || [], countsFor(updated, m.id)));
  if (allFull) {
    const teamIds = updated.players.map((p) => p.id);
    return { ...updated, status: "league", currentLot: null, fixtures: generateFixtures(teamIds) };
  }
  let pool = updated.pool;
  let nextIndex = room.lotIndex + 1;
  if (nextIndex >= pool.length) {
    if (updated.unsoldIds.length > 0) {
      pool = [...pool, ...shuffle(updated.unsoldIds)];
      updated = { ...updated, unsoldIds: [] };
    } else {
      updated = forceFillIncompleteSquads(updated);
      const teamIds = updated.players.map((p) => p.id);
      return { ...updated, status: "league", currentLot: null, fixtures: generateFixtures(teamIds) };
    }
  }
  const nextPlayerId = pool[nextIndex];
  return { ...updated, pool, lotIndex: nextIndex, currentLot: makeLot(nextPlayerId, nextIndex + 1) };
}
function lotShouldResolve(room) {
  const lot = room.currentLot;
  if (!lot) return false;
  const player = PLAYERS_BY_ID[lot.footballerId];
  const askAmount = nextBidAmount(lot.currentBid, lot.basePrice);
  const eligible = room.players.filter((m) =>
    !lot.passed.includes(m.id) &&
    m.id !== lot.currentBidderId &&
    canBid(room.squads[m.id] || [], room.remainingBudget[m.id] || 0, player, askAmount, countsFor(room, m.id))
  );
  if (lot.currentBidderId) {
    if (eligible.length === 0) return true;
  } else if (eligible.length === 0) {
    return true;
  }
  if (Date.now() >= lot.deadlineTs) return true;
  return false;
}

// Real photo when we have one (sourced from Wikipedia at build time),
// with a couple of silent retries for a transiently-flaky CDN fetch
// before falling back to the colored position badge — same resilience
// pattern as the sibling draft-battle games' sprite loader, just without
// a second fallback image since there's only ever one photo per player.
function useResilientImg(src, maxAttempts) {
  const [attempt, setAttempt] = useState(0);
  const [failed, setFailed] = useState(false);
  useEffect(() => { setAttempt(0); setFailed(false); }, [src]);
  const onError = () => {
    if (attempt < (maxAttempts || 2)) setTimeout(() => setAttempt((a) => a + 1), 400 * (attempt + 1));
    else setFailed(true);
  };
  return { failed, onError, attempt };
}
function PlayerPhoto({ player, size, rounded }) {
  const { failed, onError, attempt } = useResilientImg(player.img);
  const dim = size || 36;
  if (!player.img || failed) {
    return (
      <div style={{ width: dim, height: dim, background: POS_COLOR[player.position] }}
        className={`flex items-center justify-center font-black text-[#0A0F1A] shrink-0 ${rounded ? "rounded-full" : "rounded-lg"}`}>
        <span style={{ fontSize: dim * 0.32 }}>{player.position}</span>
      </div>
    );
  }
  return (
    <img key={attempt} src={player.img} alt={player.name} onError={onError}
      style={{ width: dim, height: dim, objectFit: "cover", background: "#1c2536" }}
      className={`shrink-0 ${rounded ? "rounded-full" : "rounded-lg"}`} />
  );
}

function CountdownBar({ deadlineTs, now }) {
  const total = LOT_DURATION_MS;
  const left = Math.max(0, deadlineTs - now);
  const pct = Math.max(0, Math.min(100, (left / total) * 100));
  const color = pct > 50 ? "#3FA796" : pct > 20 ? "#E8B23D" : "#D64545";
  return (
    <div className="w-full h-2.5 rounded-full overflow-hidden" style={{ background: "#151E30" }}>
      <div style={{ width: `${pct}%`, background: color, transition: "width 0.2s linear" }} className="h-full" />
    </div>
  );
}

function HomeScreen({ onCreate, onJoin }) {
  const [name, setName] = useState(localStorage.getItem(PERSONAL_NAME_KEY) || "");
  const [codeInput, setCodeInput] = useState("");
  const [mode, setMode] = useState("create");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    if (!name.trim()) { setError("Enter a manager name first."); return; }
    setBusy(true); setError("");
    try {
      if (mode === "create") await onCreate(name.trim());
      else {
        if (!codeInput.trim()) { setError("Enter a room code."); setBusy(false); return; }
        const ok = await onJoin(codeInput.trim().toUpperCase(), name.trim());
        if (!ok) { setError("Room not found, or the auction already started."); setBusy(false); return; }
      }
    } finally { setBusy(false); }
  };

  return (
    <div className="min-h-full flex items-center justify-center p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-8">
          <div className="text-5xl mb-2">⚽</div>
          <h1 className="font-display text-3xl md:text-4xl" style={{ color: "#E8B23D" }}>PREM AUCTION LEAGUE</h1>
          <p className="opacity-60 text-sm mt-2">Bid for real Premier League legends 1992-present, build your XI, battle it out home &amp; away.</p>
        </div>
        <div style={{ background: "#101A2E" }} className="rounded-2xl p-5 border border-white/5">
          <label className="text-xs uppercase tracking-wide opacity-60 font-bold">Manager name</label>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Sir Alex"
            className="w-full mt-1.5 mb-4 px-3 py-2.5 rounded-lg bg-[#070C16] border border-white/10 outline-none focus:border-[#E8B23D] text-sm" />

          <div className="flex gap-2 mb-4">
            <button onClick={() => setMode("create")} className={`flex-1 py-2 rounded-lg text-sm font-bold transition ${mode === "create" ? "bg-[#E8B23D] text-[#0A0F1A]" : "bg-white/5 text-white/70"}`}>Create Room</button>
            <button onClick={() => setMode("join")} className={`flex-1 py-2 rounded-lg text-sm font-bold transition ${mode === "join" ? "bg-[#E8B23D] text-[#0A0F1A]" : "bg-white/5 text-white/70"}`}>Join Room</button>
          </div>

          {mode === "join" && (
            <input value={codeInput} onChange={(e) => setCodeInput(e.target.value.toUpperCase())} placeholder="ROOM CODE" maxLength={5}
              className="w-full mb-4 px-3 py-2.5 rounded-lg bg-[#070C16] border border-white/10 outline-none focus:border-[#E8B23D] text-sm font-mono tracking-[0.3em] text-center" />
          )}

          {error && <div className="text-[#D64545] text-xs mb-3">{error}</div>}

          <button onClick={submit} disabled={busy}
            style={{ background: "#3FA796" }} className="w-full py-2.5 rounded-lg font-bold text-[#0A0F1A] active:scale-95 transition disabled:opacity-50">
            {busy ? "…" : mode === "create" ? "Create & Enter Lobby" : "Join Lobby"}
          </button>
        </div>
        <p className="text-center text-[11px] opacity-40 mt-4">2-10 players · solo play adds an AI opponent automatically</p>
      </div>
    </div>
  );
}

function AuctionScreen({ room, myId, onBid, onPass, now }) {
  const [viewingId, setViewingId] = useState(null);
  const lot = room.currentLot;
  const player = lot ? PLAYERS_BY_ID[lot.footballerId] : null;
  const me = room.players.find((m) => m.id === myId);
  const mySquad = room.squads[myId] || [];
  const myBudget = room.remainingBudget[myId] || 0;
  const myCounts = countsFor(room, myId);
  if (!lot || !player) {
    return <div className="min-h-full flex items-center justify-center opacity-60">Resolving lot…</div>;
  }
  const askAmount = nextBidAmount(lot.currentBid, lot.basePrice);
  const iPassed = lot.passed.includes(myId);
  const iAmLeading = lot.currentBidderId === myId;
  const canIBid = !iPassed && !iAmLeading && canBid(mySquad, myBudget, player, askAmount, myCounts);
  const leader = lot.currentBidderId ? room.players.find((m) => m.id === lot.currentBidderId) : null;
  const stats = detailedStats(player);
  const viewingManager = viewingId ? room.players.find((m) => m.id === viewingId) : null;

  return (
    <div className="min-h-full p-3 md:p-5 max-w-6xl mx-auto">

        <div>Lot #{lot.lotNumber} of {room.pool.length}</div>
        <div>Your formation: <span className="font-mono opacity-90">{FORMATIONS[(room.formations && room.formations[myId]) || DEFAULT_FORMATION].label}</span></div>
        <div className="font-mono">Room {room.code}</div>
      </div>
      <div className="grid md:grid-cols-[1fr_300px] gap-4">
        <div style={{ background: "#101A2E" }} className="rounded-2xl p-5 border border-white/5">
          <div key={player.id} className="pal-pop flex flex-col items-center text-center gap-2 py-4">
            <PlayerPhoto player={player} size={112} rounded />
            <div className="font-display text-3xl mt-1">{player.name}</div>
            <div className="opacity-60 text-sm">{player.club} · {player.era}</div>
            <div className="flex items-center gap-2 mt-1">
              <TierBadge tier={player.tier} />
              <span className="font-mono text-2xl font-black" style={{ color: "#E8B23D" }}>{player.rating}</span>
              <span className="font-mono text-xs opacity-50">Base {fmtM(player.basePrice)}</span>
            </div>
            <div className="grid grid-cols-2 gap-x-6 gap-y-2 w-full max-w-xs mt-3">
              {Object.entries(stats).map(([k, v]) => <StatBar key={k} label={STAT_LABEL[k]} value={v} />)}
            </div>
          </div>

          <div className="mt-4 flex flex-col items-center gap-2">
            <div className="text-xs uppercase opacity-50 tracking-wide">Current bid</div>
            <div className="font-mono font-black text-4xl" style={{ color: "#E8B23D" }}>{fmtM(lot.currentBid ?? lot.basePrice)}</div>
            <div className="text-xs opacity-70 h-4">{leader ? `${leader.name} is leading` : "No bids yet"}</div>
          </div>

          <div className="mt-4 max-w-sm mx-auto">
            <CountdownBar deadlineTs={lot.deadlineTs} now={now} />
          </div>

          <div className="mt-5 flex gap-3 justify-center">
            <button onClick={() => onBid(askAmount)} disabled={!canIBid}
              style={{ background: canIBid ? "#3FA796" : "#1c2536" }}
              className={`px-6 py-3 rounded-xl font-bold ${canIBid ? "text-[#0A0F1A] active:scale-95 pal-pulse" : "text-white/30 cursor-not-allowed"} transition`}>
              Bid {fmtM(askAmount)}
            </button>
            <button onClick={onPass} disabled={iPassed || iAmLeading}
              className={`px-6 py-3 rounded-xl font-bold border ${iPassed || iAmLeading ? "opacity-30 cursor-not-allowed border-white/10" : "border-white/20 hover:bg-white/5"}`}>
              Pass
            </button>
          </div>
          {!me ? null : iPassed ? (
            <div className="text-center text-xs opacity-50 mt-2">You passed on this lot.</div>
          ) : !canIBid && !iAmLeading ? (
            <div className="text-center text-xs opacity-50 mt-2">You can't bid — this position is full for your {FORMATIONS[(room.formations && room.formations[myId]) || DEFAULT_FORMATION].label} squad, or budget won't stretch to it.</div>

            <ManagerCard key={m.id} manager={m} squad={room.squads[m.id] || []} budget={room.remainingBudget[m.id] || 0}

        <SquadModal manager={viewingManager} squad={room.squads[viewingManager.id] || []} counts={countsFor(room, viewingManager.id)}
          formationKey={(room.formations && room.formations[viewingManager.id]) || DEFAULT_FORMATION} onClose={() => setViewingId(null)} />
      )}
    </div>
  );
}

          <div className="text-xs uppercase tracking-wide opacity-60 font-bold mb-2">Fixtures</div>
          <div className="flex flex-col gap-1.5 overflow-y-auto pr-1" style={{ maxHeight: 320 }}>
            {room.fixtures.map((f) => <FixtureRow key={f.id} fixture={f} room={room} onSimulate={onSimulate} />)}
          </div>
        </div>
      </div>
    </div>
  );
}

        ))}
      </div>
      <div className="text-5xl mb-2">🏆</div>

      <div className="opacity-60 text-sm mt-1">Top of the table after every fixture played.</div>
      {isHost && (
        <button onClick={onPlayAgain} style={{ background: "#3FA796" }} className="mt-4 px-5 py-2 rounded-lg font-bold text-[#0A0F1A] active:scale-95">

/* =========================================================================
   ROOT APP
========================================================================= */
function PremAuctionLeague() {
  const [myId] = useState(() => {
    let id = localStorage.getItem(PERSONAL_ID_KEY);
    if (!id) { id = genId(); localStorage.setItem(PERSONAL_ID_KEY, id); }
    return id;
  });
  const [code, setCode] = useState(() => localStorage.getItem(ACTIVE_ROOM_KEY) || null);
  const [room, setRoom] = useState(null);
  const [now, setNow] = useState(Date.now());
  const roomRef = useRef(null);
  roomRef.current = room;
  const resolvingRef = useRef(false);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 250);
    return () => clearInterval(t);
  }, []);

  // Poll shared room state.
  useEffect(() => {
    if (!code) return;
    let alive = true;
    const tick = async () => {
      const data = await storageGet(roomKey(code));
      if (alive && data) setRoom(data);
    };
    tick();
    const t = setInterval(tick, 800);
    return () => { alive = false; clearInterval(t); };
  }, [code]);

  // Auto-resolve auction lots (timer/pass-out) and drive AI bidding — any
  // connected tab can do this, guarded by rev so concurrent writers never
  // corrupt state; a losing write just gets picked up fresh next tick.
  // Runs on its own fixed interval rather than depending on `room`/`now`
  // (both of which change every ~250ms from the countdown re-render) —
  // depending on those would tear down and reschedule this tick before it
  // ever got a chance to fire.
  useEffect(() => {
    if (!code || !room || room.status !== "auction") return;
    const run = async () => {
      if (resolvingRef.current) return;
      const fresh = roomRef.current;
      if (!fresh || fresh.status !== "auction" || !fresh.currentLot) return;
      if (lotShouldResolve(fresh)) {
        resolvingRef.current = true;
        try {
          const updated = advanceAuction(fresh);
          await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
        } finally {
          resolvingRef.current = false;
        }
        return;
      }
      const lot = fresh.currentLot;
      const player = PLAYERS_BY_ID[lot.footballerId];
      const aiCandidates = fresh.players.filter((m) => m.isAI && m.id !== lot.currentBidderId && !lot.passed.includes(m.id));
      for (const ai of aiCandidates) {
        const squad = fresh.squads[ai.id] || [];
        const budget = fresh.remainingBudget[ai.id] || 0;
        const decision = aiDecision(ai, squad, budget, player, lot.currentBid, lot.basePrice, countsFor(fresh, ai.id));
        if (decision != null) {
          const updated = { ...fresh, currentLot: { ...lot, currentBid: decision, currentBidderId: ai.id, deadlineTs: Date.now() + LOT_DURATION_MS, passed: lot.passed.filter((id) => id !== ai.id) } };
          await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
        } else if (!lot.passed.includes(ai.id)) {
          const updated = { ...fresh, currentLot: { ...lot, passed: [...lot.passed, ai.id] } };
          await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
        }
        break; // one AI action per tick keeps writes serialized & readable
      }
    };
    const t = setInterval(run, 700);
    return () => clearInterval(t);
  }, [code, room && room.status]);

  const persistActiveRoom = (c) => {
    if (c) localStorage.setItem(ACTIVE_ROOM_KEY, c); else localStorage.removeItem(ACTIVE_ROOM_KEY);
  };

  const createRoom = async (name) => {
    localStorage.setItem(PERSONAL_NAME_KEY, name);
    const newCode = genCode();
    const me = { id: myId, name, isAI: false, colorIdx: 0 };
    const initial = {
      code: newCode, rev: 1, status: "lobby", hostId: myId, budget: 550,
      players: [me], squads: { [myId]: [] }, remainingBudget: { [myId]: 550 },
      formations: { [myId]: DEFAULT_FORMATION },
      pool: [], lotIndex: -1, currentLot: null, soldLog: [], unsoldIds: [],
      fixtures: [],
    };
    await storageSet(roomKey(newCode), initial);
    persistActiveRoom(newCode);
    setCode(newCode);
    setRoom(initial);
  };

  const joinRoom = async (joinCode, name) => {
    const existing = await storageGet(roomKey(joinCode));
    if (!existing || existing.status !== "lobby") return false;
    if (existing.players.some((p) => p.id === myId)) {
      persistActiveRoom(joinCode); setCode(joinCode); setRoom(existing); return true;
    }
    if (existing.players.length >= 10) return false;
    localStorage.setItem(PERSONAL_NAME_KEY, name);
    const me = { id: myId, name, isAI: false, colorIdx: existing.players.length };
    const updated = {
      ...existing, rev: existing.rev + 1,
      players: [...existing.players, me],
      squads: { ...existing.squads, [myId]: [] },
      remainingBudget: { ...existing.remainingBudget, [myId]: existing.budget },
      formations: { ...existing.formations, [myId]: DEFAULT_FORMATION },
    };
    const ok = await commitIfRevMatches(roomKey(joinCode), existing, updated);
    if (!ok) return false;
    persistActiveRoom(joinCode); setCode(joinCode); setRoom(updated);
    return true;
  };

  const updateBudget = async (budget) => {
    const fresh = roomRef.current; if (!fresh) return;
    const remainingBudget = {};
    fresh.players.forEach((p) => (remainingBudget[p.id] = budget));
    const updated = { ...fresh, budget, remainingBudget, rev: fresh.rev + 1 };
    setRoom(updated);
    await commitIfRevMatches(roomKey(code), fresh, updated);
  };

  const setFormation = async (formationKey) => {
    const fresh = roomRef.current; if (!fresh) return;
    const updated = { ...fresh, formations: { ...fresh.formations, [myId]: formationKey }, rev: fresh.rev + 1 };
    setRoom(updated);
    await commitIfRevMatches(roomKey(code), fresh, updated);
  };

  const startAuction = async () => {
    const fresh = roomRef.current; if (!fresh) return;
    let players = fresh.players;
    let squads = { ...fresh.squads };
    let remainingBudget = { ...fresh.remainingBudget };
    let formations = { ...fresh.formations };
    if (players.length < 2) {
      const bot = { id: "AI_" + genId(), name: AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)], isAI: true, colorIdx: players.length };
      players = [...players, bot];
      squads[bot.id] = [];
      remainingBudget[bot.id] = fresh.budget;
      formations[bot.id] = randomFormationKey();
    }
    const pool = shuffle(PLAYERS.map((p) => p.id));
    const updated = {
      ...fresh, players, squads, remainingBudget, formations, status: "auction",
      pool, lotIndex: 0, currentLot: makeLot(pool[0], 1), soldLog: [], unsoldIds: [],
    };
    await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
  };

  // Bid/pass update local state immediately (optimistic) so the click
  // feels instant, then fire the network commit in the background — the
  // next poll (or a failed rev match) reconciles with server truth, so a
  // lost race just self-heals a moment later instead of blocking the UI.
  const placeBid = async (amount) => {
    const fresh = roomRef.current; if (!fresh || !fresh.currentLot) return;
    const lot = fresh.currentLot;
    const player = PLAYERS_BY_ID[lot.footballerId];
    const squad = fresh.squads[myId] || [];
    const budget = fresh.remainingBudget[myId] || 0;
    if (!canBid(squad, budget, player, amount, countsFor(fresh, myId))) return;
    const updated = { ...fresh, currentLot: { ...lot, currentBid: amount, currentBidderId: myId, deadlineTs: Date.now() + LOT_DURATION_MS, passed: lot.passed.filter((id) => id !== myId) }, rev: fresh.rev + 1 };
    setRoom(updated);
    await commitIfRevMatches(roomKey(code), fresh, updated);
  };
  const passLot = async () => {
    const fresh = roomRef.current; if (!fresh || !fresh.currentLot) return;
    const lot = fresh.currentLot;
    if (lot.passed.includes(myId)) return;
    const updated = { ...fresh, currentLot: { ...lot, passed: [...lot.passed, myId] }, rev: fresh.rev + 1 };
    setRoom(updated);
    await commitIfRevMatches(roomKey(code), fresh, updated);
  };

  const simulateOne = async (fixtureId) => {
    const fresh = roomRef.current; if (!fresh) return;
    const fixture = fresh.fixtures.find((f) => f.id === fixtureId);
    if (!fixture || fixture.played) return;
    const homeM = fresh.players.find((m) => m.id === fixture.home);
    const awayM = fresh.players.find((m) => m.id === fixture.away);
    const result = simulateFixture(fresh.squads[fixture.home] || [], fresh.squads[fixture.away] || [], homeM.name, awayM.name,
      fresh.formations[fixture.home], fresh.formations[fixture.away]);
    const fixtures = fresh.fixtures.map((f) => f.id === fixtureId ? { ...f, played: true, homeGoals: result.homeGoals, awayGoals: result.awayGoals, log: result.log } : f);
    const updated = { ...fresh, fixtures };
    await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
  };
  const simulateAll = async () => {
    let fresh = roomRef.current; if (!fresh) return;
    let fixtures = [...fresh.fixtures];
    fixtures = fixtures.map((f) => {
      if (f.played) return f;
      const homeM = fresh.players.find((m) => m.id === f.home);
      const awayM = fresh.players.find((m) => m.id === f.away);
      const result = simulateFixture(fresh.squads[f.home] || [], fresh.squads[f.away] || [], homeM.name, awayM.name,
        fresh.formations[f.home], fresh.formations[f.away]);
      return { ...f, played: true, homeGoals: result.homeGoals, awayGoals: result.awayGoals, log: result.log };
    });
    const updated = { ...fresh, fixtures };
    await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
  };

  const playAgain = async () => {
    const fresh = roomRef.current; if (!fresh) return;
    const squads = {}; const remainingBudget = {};
    fresh.players.forEach((p) => { squads[p.id] = []; remainingBudget[p.id] = fresh.budget; });
    const updated = { ...fresh, status: "lobby", squads, remainingBudget, pool: [], lotIndex: -1, currentLot: null, soldLog: [], unsoldIds: [], fixtures: [] };
    await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
  };

  const leaveRoom = () => { persistActiveRoom(null); setCode(null); setRoom(null); };

  if (!code || !room) {
    return <HomeScreen onCreate={createRoom} onJoin={joinRoom} />;
  }
  if (room.status === "lobby") {
    return <LobbyScreen room={room} myId={myId} onUpdateBudget={updateBudget} onSetFormation={setFormation} onStart={startAuction} onLeave={leaveRoom} />;
  }
  if (room.status === "auction") {
    return <AuctionScreen room={room} myId={myId} onBid={placeBid} onPass={passLot} now={now} />;
  }
  if (room.status === "league") {
    return <LeagueScreen room={room} myId={myId} onSimulate={simulateOne} onSimulateAll={simulateAll} onPlayAgain={playAgain} />;
  }
  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PremAuctionLeague />);
</script>
