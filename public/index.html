<title>Prem Auction League — Online Multiplayer</title>

<style>
  html, body, #root { height: 100%; margin: 0; color: #EDEBE3; font-family: 'Manrope', sans-serif; }
  /* Stadium-floodlight backdrop — a wash of Premier League purple glowing
     down from the top over near-black, instead of a flat dark panel. This
     is the single biggest driver of "broadcast" vs "generic dashboard". */
  body {
    background:
      radial-gradient(ellipse 1100px 650px at 50% -8%, rgba(150,60,255,0.22), transparent 62%),
      radial-gradient(ellipse 900px 500px at 100% 105%, rgba(63,167,150,0.10), transparent 60%),
      radial-gradient(ellipse 700px 450px at 0% 105%, rgba(232,178,61,0.06), transparent 60%),
      #070912;
    background-attachment: fixed;
  }
  /* Oswald (condensed, athletic — genuine sports-broadcast typography)
     is the everyday display face: player names, headers, badges. It
     stays legible at small sizes, unlike Anton, which is now reserved
     for .font-hero — the one or two biggest moments per screen (the
     home title, "X WINS THE LEAGUE") where its extra weight earns its
     keep instead of just being loud everywhere. */
  .font-display { font-family: 'Oswald', sans-serif; letter-spacing: 0.01em; font-weight: 600; }
  .font-hero { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #263148; border-radius: 8px; }
  @keyframes pal-pop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .pal-pop { animation: pal-pop 0.35s ease; }
  @keyframes pal-stamp { 0% { transform: scale(2.2) rotate(-12deg); opacity: 0; } 60% { transform: scale(0.92) rotate(-12deg); opacity: 1; } 100% { transform: scale(1) rotate(-12deg); opacity: 1; } }
  .pal-stamp { animation: pal-stamp 0.4s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pal-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(232,178,61,0.55); } 50% { box-shadow: 0 0 0 8px rgba(232,178,61,0); } }
  .pal-pulse { animation: pal-pulse 1.1s ease infinite; }
  @keyframes pal-confetti { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(112vh) rotate(360deg); opacity: 0.9; } }
  .pal-confetti { animation: pal-confetti linear forwards; }
  @keyframes pal-shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
  /* Diagonal shine sweep across a player card on reveal — the FUT-card
     "special edition" cue. */
  @keyframes pal-card-shine { 0% { transform: translateX(-130%) rotate(20deg); } 100% { transform: translateX(130%) rotate(20deg); } }
  .pal-card-shine { animation: pal-card-shine 1.1s ease-out; }
  @keyframes pal-card-glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  .pal-card-glow { animation: pal-card-glow 2.4s ease-in-out infinite; }
  /* Gentle entrance for a whole screen swap (lobby -> auction -> league)
     so switching phases reads as a transition, not a jump cut. */
  @keyframes pal-fade-in { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
  .pal-fade-in { animation: pal-fade-in 0.3s ease; }
  /* Urgent variant of pal-pulse for the countdown bar once time is short. */
  @keyframes pal-pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(214,69,69,0.55); } 50% { box-shadow: 0 0 0 6px rgba(214,69,69,0); } }
  .pal-pulse-red { animation: pal-pulse-red 0.8s ease infinite; }
  /* Tactile hover lift for clickable cards. */
  .pal-lift { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .pal-lift:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
  .pal-lift:active { transform: translateY(0) scale(0.98); }
  @keyframes pal-dots { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  .pal-dot { animation: pal-dots 1.4s ease-in-out infinite; }
  /* Themed range slider — browsers render <input type="range"> with their
     own native (usually blue) styling that can't be reached with
     Tailwind utility classes, so it's the one control that needs real
     CSS to match the rest of the dark/teal/gold palette. */
  input[type="range"].pal-range { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: #151E30; outline: none; }
  input[type="range"].pal-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #E8B23D; border: 3px solid #0A0F1A; cursor: pointer; box-shadow: 0 0 0 1px rgba(232,178,61,0.4); }
  input[type="range"].pal-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #E8B23D; border: 3px solid #0A0F1A; cursor: pointer; box-shadow: 0 0 0 1px rgba(232,178,61,0.4); }
  input[type="range"].pal-range::-moz-range-track { background: #151E30; height: 6px; border-radius: 999px; }
  input[type="range"].pal-range:disabled::-webkit-slider-thumb { background: #4A4F5A; box-shadow: none; }
  input[type="range"].pal-range:disabled::-moz-range-thumb { background: #4A4F5A; box-shadow: none; }
  input[type="range"].pal-range:disabled { cursor: not-allowed; }
</style>

// Auction base price (£M). Mildly convex in rating (top Icons cost more
// per point than mid-table Quality players do) but capped well short of
// the old curve, which let a single Icon eat ~30% of a full budget on its
// own. Calibrated against the actual 163-player pool (ratings 76-98, mean
// ~85.5): an "average" full XI now costs roughly a full default budget
// (~£550M for 11 players), not 2-3x it — buying a genuine Icon (98) costs
// about 2x an average XI slot, not 6-7x.
function basePriceForRating(r) {
  const t = Math.max(0, Math.min(1, (r - 58) / (99 - 58)));
  const price = 1.5 + Math.pow(t, 1.7) * 93.5;
  return Math.max(1.5, Math.round(price * 2) / 2);
}

const SQUAD_SIZE = 11;
const MIN_PRICE_FLOOR = 1.5;

// compressed into real seconds — rather than jumping straight to the
// final score. The result itself is decided instantly and stored right
// away (no re-simulation, no race risk); every viewer's clock reads off
// the SAME stored `liveStartedAt` timestamp, so anyone looking at the
// fixture sees the same goals land at the same real moments without any
// server push — just elapsed-time math against a shared start point.
const LIVE_MATCH_MS = 13500;
const MS_PER_GAME_MINUTE = LIVE_MATCH_MS / 90;

// Each manager locks in a formation before the auction starts, which sets
// the EXACT position shape their 11 must fill (not just minimums — a
// 3-5-2 squad has exactly 3 defenders, never 4). In the match engine each
// formation trades attack strength for defense (or vice versa) or lets a
// strong midfield lift both ends a little — tuned via Monte Carlo
// (tune-formations.js) so no formation dominates in a fair fight; the
// real reward for matching a formation to your squad is economic: it
// lets you commit auction budget to the positions that formation plays
// more of, instead of splitting money across a shape you didn't want.
const FORMATIONS = {
  "4-4-2": { label: "4-4-2", tag: "Balanced", counts: { GK: 1, DEF: 4, MID: 4, FWD: 2 }, attackMult: 1.0, defenseMult: 1.0, desc: "No bonus, no penalty — even spread across the pitch." },
  "4-3-3": { label: "4-3-3", tag: "Attacking", counts: { GK: 1, DEF: 4, MID: 3, FWD: 3 }, attackMult: 1.07, defenseMult: 0.93, desc: "+7% attack, -7% defense — three forwards, go for goals." },
  "5-3-2": { label: "5-3-2", tag: "Defensive", counts: { GK: 1, DEF: 5, MID: 3, FWD: 2 }, attackMult: 0.93, defenseMult: 1.07, desc: "+7% defense, -7% attack — five at the back, hard to beat." },
  "3-5-2": { label: "3-5-2", tag: "Midfield Control", counts: { GK: 1, DEF: 3, MID: 5, FWD: 2 }, midControl: 0.05, desc: "A strong midfield lifts both ends slightly — thin at the back." },
  "4-2-3-1": { label: "4-2-3-1", tag: "Possession", counts: { GK: 1, DEF: 4, MID: 5, FWD: 1 }, midControl: 0.04, desc: "Extra midfielder for control, a lone striker leads the line." },
};
const DEFAULT_FORMATION = "4-4-2";

function positionCounts(squad) {
  const c = { GK: 0, DEF: 0, MID: 0, FWD: 0 };
  squad.forEach((p) => c[p.position]++);
  return c;
}
// Whether `manager` can legally place a bid of `amount` for `player` given
// their current squad/budget and formation shape — checks that this
// position's exact quota isn't already full, budget, and that enough
// slots + money remain afterward to still fill every other required
// position (so a manager can never bid themselves into an unfillable
// squad for the formation they picked).
function canBid(squad, budget, player, amount, counts) {
  if (squad.length >= SQUAD_SIZE) return false;
  const c = positionCounts(squad);
  if (c[player.position] >= counts[player.position]) return false;
  if (amount > budget + 1e-9) return false;
  const hypothetical = [...squad, player];
  const hc = positionCounts(hypothetical);
  const neededAfter = Object.keys(counts).reduce((s, pos) => s + Math.max(0, counts[pos] - hc[pos]), 0);
  const slotsLeftAfter = SQUAD_SIZE - hypothetical.length;
  if (slotsLeftAfter < neededAfter) return false;
  const budgetAfter = budget - amount;
  if (budgetAfter < slotsLeftAfter * MIN_PRICE_FLOOR - 1e-9) return false;
  return true;
}
function squadIsComplete(squad, counts) {
  if (squad.length !== SQUAD_SIZE) return false;
  const c = positionCounts(squad);
  return Object.keys(counts).every((pos) => c[pos] >= counts[pos]);
}

// Increment is 10% of THIS lot's base price, not the current bid — so a
// £24M defender and a £91M Icon each escalate in steps sized to their own
// value instead of both jumping by the same flat amount once they cross
// the same absolute price line. Floored at £0.5M so a very cheap lot
// still makes real forward progress each round (no getting stuck raising
// by £1M forever), and capped at £10M so even the priciest Icon can't
// somehow escalate by more than that in a single step.
function bidIncrement(basePrice) {
  return Math.min(10, Math.max(0.5, Math.round(basePrice * 0.10 * 2) / 2));
}
function nextBidAmount(currentBid, basePrice) {
  if (currentBid == null) return basePrice;
  return Math.round((currentBid + bidIncrement(basePrice)) * 2) / 2;
}
function fmtM(n) {
  if (n == null) return "—";
  return "£" + (Math.round(n * 10) / 10).toFixed(n % 1 === 0 ? 0 : 1) + "M";
}
function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}
// The auction runs in position categories — all goalkeepers first, then
// defenders, then midfielders, then forwards (each block shuffled on its
// own) — same structure as a real IPL-style auction going category by
// category, rather than every position mixed into one random sequence.
const AUCTION_POSITION_ORDER = ["GK", "DEF", "MID", "FWD"];
function buildAuctionPool() {
  let pool = [];
  AUCTION_POSITION_ORDER.forEach((pos) => {
    const ids = PLAYERS.filter((p) => p.position === pos).map((p) => p.id);
    pool = pool.concat(shuffle(ids));
  });
  return pool;
}
function round1(n) {
  return Math.round(n * 10) / 10;
}

// Deterministic per-player "sub-stats" (seeded on the player's id, so
// they're stable across renders/sessions rather than reshuffling) that
// break the single overall rating into a small position-appropriate
// profile — gives bidders more to weigh than one number. Averages back
// out close to the overall rating; not a second data source, just a
// readable decomposition of it.
function seededRand(seed) {

const STAT_PROFILES = {
  GK: { REF: 6, HAN: 2, KIC: -3, POS: 3 },
  DEF: { PAC: -3, ATT: -15, PAS: 0, DEF: 11 },
  MID: { PAC: -1, ATT: -4, PAS: 9, DEF: 2 },
  FWD: { PAC: 6, ATT: 11, PAS: -3, DEF: -15 },
};
// Returns both the displayed stat values AND each stat's raw jitter
// (deviation from what's "typical" for that position/rating). The jitter
// is the individual-variation signal — two 85-rated defenders both show
// DEF-profile-shaped stats, but one might have unusually good Pace for a
// defender and one unusually poor; that's what formation suitability
// below reads, not the absolute stat number (which is dominated by the
// fixed position archetype offset and would otherwise make e.g. "any
// forward" look pacy relative to their own rating, telling you nothing
// about which forward is faster than another).
function detailedStatsRaw(player) {
  const rand = seededRand(player.id * 9301 + 49297);
  const profile = STAT_PROFILES[player.position];
  const stats = {}, deviations = {};
  Object.keys(profile).forEach((k) => {
    const jitter = Math.round((rand() - 0.5) * 8);
    deviations[k] = jitter;
    stats[k] = Math.max(35, Math.min(99, Math.round(player.rating + profile[k] + jitter)));

  return { stats, deviations };
}
function detailedStats(player) {
  return detailedStatsRaw(player).stats;
}
const STAT_LABEL = { REF: "Reflexes", HAN: "Handling", KIC: "Kicking", POS: "Positioning", PAC: "Pace", ATT: "Attack", PAS: "Passing", DEF: "Defending" };

// Which sub-stat each line is actually judged on for formations that care
// about player suitability (4-4-2 stays neutral by design — a true
// "no bonus, no penalty" baseline). A player whose relevant stat runs hot
// for their type gets a small boost playing that system; one who runs
// cold gets a small penalty — same overall rating, different fit.
const FORMATION_KEY_STAT = {
  "4-3-3": { FWD: "PAC", MID: "ATT", DEF: "PAC" },
  "5-3-2": { DEF: "DEF", MID: "DEF" },
  "3-5-2": { MID: "PAS" },
  "4-2-3-1": { MID: "PAS" },
};
function effectiveRating(player, formationKey) {
  const keyStats = FORMATION_KEY_STAT[formationKey];
  const statKey = keyStats && keyStats[player.position];
  if (!statKey) return player.rating;
  const { deviations } = detailedStatsRaw(player);
  return player.rating + deviations[statKey];
}
function suitabilityFor(player, formationKey) {
  const keyStats = FORMATION_KEY_STAT[formationKey];
  const statKey = keyStats && keyStats[player.position];
  if (!statKey) return null;
  const { deviations } = detailedStatsRaw(player);
  return { statKey, deviation: deviations[statKey] };
}

/* =========================================================================
   LEAGUE / MATCH SIMULATION
========================================================================= */
// A line's rating is a blend of a power-mean over its players (rewards
// squad depth — several good players beats one great one propped up by
// scrubs) and its single best player (guarantees one marquee auction
// buy is always clearly felt, not diluted away by 2-3 average
// teammates). Tuned via Monte Carlo simulation (see project notes): with
// this blend, swapping one weak player for one Icon produces roughly the
// same match impact as upgrading a whole tier's worth of squad depth —
// which is what "the auction result should matter" means in practice.
const LINE_POWER = 1.5;
const BEST_PLAYER_WEIGHT = 0.4;
function powerMean(ratings, p) {
  if (!ratings.length) return 62;
  let numer = 0, denom = 0;
  ratings.forEach((r) => { const w = Math.pow(r, p); numer += w * r; denom += w; });
  return numer / denom;
}
function lineRating(ratings) {
  if (!ratings.length) return 62;
  const pm = powerMean(ratings, LINE_POWER);
  const best = Math.max(...ratings);
  return pm * (1 - BEST_PLAYER_WEIGHT) + best * BEST_PLAYER_WEIGHT;
}
function teamRatings(squad, formationKey) {
  const gk = squad.find((p) => p.position === "GK");
  const def = squad.filter((p) => p.position === "DEF").map((p) => effectiveRating(p, formationKey));
  const mid = squad.filter((p) => p.position === "MID").map((p) => effectiveRating(p, formationKey));
  const fwd = squad.filter((p) => p.position === "FWD").map((p) => effectiveRating(p, formationKey));
  const fwdLine = lineRating(fwd);
  const midLine = lineRating(mid);
  const defLine = lineRating(def);
  const gkLine = gk ? gk.rating : 62;
  let attack = fwdLine * 0.6 + midLine * 0.4;
  let defense = defLine * 0.65 + gkLine * 0.35;
  const f = FORMATIONS[formationKey] || FORMATIONS[DEFAULT_FORMATION];
  if (f.attackMult) attack *= f.attackMult;
  if (f.defenseMult) defense *= f.defenseMult;
  if (f.midControl) {
    const bonus = (midLine - 78) * f.midControl;
    attack += bonus;
    defense += bonus * 0.8;
  }
  const overall = squad.length ? squad.reduce((s, p) => s + p.rating, 0) / squad.length : 62;
  return { attack, defense, overall };
}
function expectedGoals(myAttack, oppDefense, isHome) {
  const diff = myAttack - oppDefense;
  let xg = 1.3 + diff / 15;
  if (isHome) xg += 0.18;
  return Math.max(0.1, xg);
}
// Knuth's Poisson sampler — gives a realistic scatter of scorelines around
// the expected-goals value instead of always rounding to the same number.
function poissonSample(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}
function pickScorer(squad) {
  const eligible = squad.filter((p) => p.position === "FWD" || p.position === "MID");
  const pool = eligible.length ? eligible : squad;
  const weights = pool.map((p) => Math.pow(1.06, p.rating));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
function simulateFixture(homeSquad, awaySquad, homeName, awayName, homeFormation, awayFormation) {
  const h = teamRatings(homeSquad, homeFormation), a = teamRatings(awaySquad, awayFormation);
  const hxg = expectedGoals(h.attack, a.defense, true);
  const axg = expectedGoals(a.attack, h.defense, false);
  const homeGoals = poissonSample(hxg);
  const awayGoals = poissonSample(axg);
  const log = [];
  const events = [];
  for (let i = 0; i < homeGoals; i++) events.push({ side: "home", minute: 1 + Math.floor(Math.random() * 89), scorer: pickScorer(homeSquad) });
  for (let i = 0; i < awayGoals; i++) events.push({ side: "away", minute: 1 + Math.floor(Math.random() * 89), scorer: pickScorer(awaySquad) });
  events.sort((x, y) => x.minute - y.minute);
  events.forEach((e) => {
    const team = e.side === "home" ? homeName : awayName;
    log.push(`⚽ ${e.minute}' — ${e.scorer.name} scores for ${team}!`);
  });
  if (!events.length) log.push("A goalless stalemate — both defenses held firm.");
  log.push(`Full time: ${homeName} ${homeGoals} - ${awayGoals} ${awayName}`);

  // commentary view; this is what the always-visible scorer line reads
  // from, so it doesn't need to regex-parse the prose back apart).
  const scorers = events.map((e) => ({ minute: e.minute, side: e.side, id: e.scorer.id, name: e.scorer.name, position: e.scorer.position }));

// Circle-method double round robin: every pair of teams meets twice (home
// & away), matching a real league season rather than a knockout bracket.
function generateFixtures(teamIds) {
  const ids = [...teamIds];
  const hasBye = ids.length % 2 !== 0;
  if (hasBye) ids.push(null);
  const n = ids.length;
  const rounds = [];
  const arr = [...ids];
  for (let r = 0; r < n - 1; r++) {
    const round = [];
    for (let i = 0; i < n / 2; i++) {
      const t1 = arr[i], t2 = arr[n - 1 - i];
      if (t1 != null && t2 != null) round.push(r % 2 === 0 ? [t1, t2] : [t2, t1]);
    }
    rounds.push(round);
    arr.splice(1, 0, arr.pop());
  }
  const fixtures = [];
  let id = 0;
  rounds.forEach((round) => round.forEach(([home, away]) => {
    fixtures.push({ id: `f${id++}`, home, away, leg: 1, played: false, homeGoals: null, awayGoals: null, log: [] });
  }));
  rounds.forEach((round) => round.forEach(([home, away]) => {
    fixtures.push({ id: `f${id++}`, home: away, away: home, leg: 2, played: false, homeGoals: null, awayGoals: null, log: [] });
  }));
  return fixtures;
}
function computeTable(teamIds, fixtures) {
  const table = {};
  teamIds.forEach((t) => (table[t] = { id: t, played: 0, won: 0, draw: 0, lost: 0, gf: 0, ga: 0, pts: 0 }));
  fixtures.filter((f) => f.played).forEach((f) => {
    const h = table[f.home], a = table[f.away];
    if (!h || !a) return;
    h.played++; a.played++;
    h.gf += f.homeGoals; h.ga += f.awayGoals;
    a.gf += f.awayGoals; a.ga += f.homeGoals;
    if (f.homeGoals > f.awayGoals) { h.won++; h.pts += 3; a.lost++; }
    else if (f.homeGoals < f.awayGoals) { a.won++; a.pts += 3; h.lost++; }
    else { h.draw++; a.draw++; h.pts += 1; a.pts += 1; }
  });
  return Object.values(table).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
}

// Goals scored per player across every played fixture in the room — the
// basis for the tournament's Star Player and for weighting Team of the
// Tournament selection toward players who actually delivered, not just
// whoever has the highest static rating.
function computeGoalTally(fixtures) {
  const tally = {};
  fixtures.filter((f) => f.played).forEach((f) => {
    (f.scorers || []).forEach((s) => {
      if (s.id == null) return;
      tally[s.id] = (tally[s.id] || 0) + 1;
    });
  });
  return tally;
}
// Single standout of the tournament: most goals scored, ties broken by
// rating. Only meaningful once at least one goal has actually gone in.
function computeStarPlayer(room) {
  const tally = computeGoalTally(room.fixtures || []);
  const allPlayers = Object.values(room.squads || {}).flat();
  let best = null;
  allPlayers.forEach((p) => {
    const goals = tally[p.id] || 0;
    if (goals === 0) return;
    if (!best || goals > best.goals || (goals === best.goals && p.rating > best.player.rating)) {
      best = { player: p, goals };
    }

  return best;

// each by rating plus a bonus for goals actually scored this tournament,
// then — for every formation shape — sums the best available score per
// position slot and keeps whichever formation yields the strongest
// possible combined XI. That's "choose the formation as per best fit":
// it's not a fixed choice, it's whichever shape actually accommodates
// the deepest pool of standouts this particular tournament produced.
function computeTeamOfTournament(room) {
  const tally = computeGoalTally(room.fixtures || []);
  const allPlayers = Object.values(room.squads || {}).flat();
  if (allPlayers.length === 0) return null;
  const scored = allPlayers.map((p) => ({ player: p, score: p.rating + (tally[p.id] || 0) * 2 }));
  const byPos = { GK: [], DEF: [], MID: [], FWD: [] };
  scored.forEach((s) => byPos[s.player.position].push(s));
  Object.values(byPos).forEach((arr) => arr.sort((a, b) => b.score - a.score));

  let bestFormation = null, bestSquad = null, bestTotal = -Infinity;
  Object.keys(FORMATIONS).forEach((fKey) => {
    const counts = FORMATIONS[fKey].counts;
    const squad = [];
    let total = 0;
    let feasible = true;
    Object.keys(counts).forEach((pos) => {
      const need = counts[pos];
      const pool = byPos[pos] || [];
      if (pool.length < need) feasible = false;
      pool.slice(0, need).forEach((s) => { squad.push(s.player); total += s.score; });
    });
    if (feasible && total > bestTotal) {

function computeGoldenGlove(room) {

  const played = table.filter((t) => t.played > 0);
  if (played.length === 0) return null;
  const best = [...played].sort((a, b) => a.ga - b.ga || b.gf - a.gf)[0];
  const manager = room.players.find((p) => p.id === best.id);
  const gk = (room.squads[best.id] || []).filter((p) => p.position === "GK").sort((a, b) => b.rating - a.rating)[0];

// Signing of the Season: the auctioned (not force-filled) player with the
// best goals-per-£M spent among everyone who actually scored — the
// "what a bargain" narrative. Falls back to rating-per-£M if nobody
// bought this tournament found the net.
function computeSigningOfTheSeason(room) {
  const tally = computeGoalTally(room.fixtures || []);
  const sold = (room.soldLog || []).filter((e) => e.buyerId && e.price > 0);
  if (sold.length === 0) return null;
  const withGoals = sold.filter((e) => (tally[e.footballerId] || 0) > 0);
  const pool = withGoals.length > 0 ? withGoals : sold;
  let best = null;
  pool.forEach((entry) => {
    const player = PLAYERS_BY_ID[entry.footballerId];
    if (!player) return;
    const goals = tally[player.id] || 0;
    const value = withGoals.length > 0 ? goals / entry.price : player.rating / entry.price;
    if (!best || value > best.value) {
      best = { player, price: entry.price, goals, manager: room.players.find((m) => m.id === entry.buyerId), value };
    }
  });
  return best;
}

const AI_NAMES = ["Gaffer Bot", "Tactics Bot", "Scout Bot", "Ledger Bot", "Rotation Bot", "Wildcard Bot"];

function aiWillingness(manager, squad, player, counts) {

  const underMin = (counts[player.position] || 0) > c[player.position];
  const needMultiplier = underMin ? 1.35 : squad.length < SQUAD_SIZE * 0.6 ? 1.05 : 0.75;

  const willingness = aiWillingness(manager, squad, player, counts);

   SHARED STATE (server-backed KV store, polling sync)
========================================================================= */
async function storageGet(key, shared = true) {
  try {
    if (!shared) {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
    const res = await fetch(`/api/kv/${encodeURIComponent(key)}`);
    if (res.status === 404) return null;
    if (!res.ok) return null;
    const r = await res.json();
    return r && r.value !== undefined ? JSON.parse(r.value) : null;
  } catch { return null; }
}
// Distinguishes a genuine "this key was deleted" 404 from a transient
// network hiccup (which also surfaces as no value from storageGet) — the
// room-poll loop needs this distinction so a momentary fetch failure
// never gets misread as "the host closed the room."
async function fetchRoomStatus(key) {
  try {
    const res = await fetch(`/api/kv/${encodeURIComponent(key)}`);
    if (res.status === 404) return { deleted: true, value: null };
    if (!res.ok) return { deleted: false, value: null };
    const r = await res.json();
    return { deleted: false, value: r && r.value !== undefined ? JSON.parse(r.value) : null };
  } catch { return { deleted: false, value: null }; }
}
async function storageDelete(key) {
  try {
    await fetch(`/api/kv/${encodeURIComponent(key)}`, { method: "DELETE" });
    return true;
  } catch (e) { console.error("storage delete failed", e); return false; }
}
async function storageSet(key, value, shared = true, expectedRev) {
  try {
    if (!shared) { localStorage.setItem(key, JSON.stringify(value)); return true; }
    const body = { value: JSON.stringify(value) };
    if (expectedRev !== undefined) body.expectedRev = expectedRev;
    const res = await fetch(`/api/kv/${encodeURIComponent(key)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    return res.ok;
  } catch (e) { console.error("storage set failed", e); return false; }
}
// A single atomic PUT with the rev we expect to be overwriting, checked
// server-side with no gap between the check and the write — replaces an
// earlier GET-then-PUT version of this that had a real race window: two
// concurrent callers could both pass the check and both write, with the
// second silently clobbering the first (e.g. two players joining a room
// in the same instant, one of them just vanishing with no error shown).
async function commitIfRevMatches(key, fresh, updated) {
  return await storageSet(key, updated, true, fresh.rev);
}
// Same atomic write, but on a 409 it reads the current value straight out
// of the conflict response instead of returning a plain boolean — a
// retrying caller (commitWithRetry, below) can then recompute against
// that immediately with no separate GET. Over a real network (not
// localhost) that's the difference between a retry costing one round
// trip and costing two, which is most of what "lag" turned out to be
// once multiple people were actually colliding on the same lot.
async function casWrite(key, value, expectedRev) {
  try {
    const res = await fetch(`/api/kv/${encodeURIComponent(key)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: JSON.stringify(value), expectedRev }),
    });
    if (res.ok) return { ok: true };
    if (res.status === 409) {
      const data = await res.json().catch(() => null);
      let currentValue = null;
      if (data && data.currentValue) { try { currentValue = JSON.parse(data.currentValue); } catch { /* fall through */ } }
      return { ok: false, currentValue };
    }
    return { ok: false, currentValue: null };
  } catch (e) { console.error("cas write failed", e); return { ok: false, currentValue: null }; }
}

function makeLot(footballerId, lotNumber) {
  const player = PLAYERS_BY_ID[footballerId];

function resolveLot(room) {
  const lot = room.currentLot;
  const player = PLAYERS_BY_ID[lot.footballerId];
  const squads = { ...room.squads };
  const remainingBudget = { ...room.remainingBudget };
  const soldLog = [...room.soldLog];
  let unsoldIds = [...room.unsoldIds];
  if (lot.currentBidderId) {
    const buyer = lot.currentBidderId;
    squads[buyer] = [...(squads[buyer] || []), player];
    remainingBudget[buyer] = round1(remainingBudget[buyer] - lot.currentBid);
    soldLog.unshift({ footballerId: player.id, buyerId: buyer, price: lot.currentBid, lotNumber: lot.lotNumber });
  } else {
    unsoldIds.push(player.id);
    soldLog.unshift({ footballerId: player.id, buyerId: null, price: null, lotNumber: lot.lotNumber });
  }
  return { ...room, squads, remainingBudget, soldLog, unsoldIds };

// Every manager's formation counts, keyed by id — falls back to the
// default formation for anyone who somehow has none set (shouldn't
// happen once the lobby always seeds one on join).
function countsFor(room, managerId) {
  const key = (room.formations && room.formations[managerId]) || DEFAULT_FORMATION;
  return FORMATIONS[key].counts;
}
// Absolute safety net: if the pool (plus recycled unsold lots) runs dry
// before every squad is full, force-fill remaining slots from whatever
// eligible players are left so no manager gets stuck with an invalid team.
function forceFillIncompleteSquads(room) {
  let squads = { ...room.squads };
  let remainingBudget = { ...room.remainingBudget };
  const ownedIds = new Set(Object.values(squads).flat().map((p) => p.id));
  room.players.forEach((m) => {
    let squad = squads[m.id] || [];
    let budget = remainingBudget[m.id] || 0;
    const counts = countsFor(room, m.id);
    let guard = 0;
    while (!squadIsComplete(squad, counts) && squad.length < SQUAD_SIZE && guard < 400) {
      guard++;
      const c = positionCounts(squad);
      const neededPos = Object.keys(counts).find((pos) => c[pos] < counts[pos]) || "DEF";
      const candidate = PLAYERS.filter((p) => !ownedIds.has(p.id) && p.position === neededPos)
        .sort((a, b) => a.basePrice - b.basePrice)[0]
        || PLAYERS.filter((p) => !ownedIds.has(p.id)).sort((a, b) => a.basePrice - b.basePrice)[0];
      if (!candidate) break;
      ownedIds.add(candidate.id);
      const price = Math.min(candidate.basePrice, Math.max(0, budget));
      squad = [...squad, candidate];
      budget = round1(budget - price);

    remainingBudget[m.id] = budget;

}
function advanceAuction(room) {

  const allFull = updated.players.every((m) => squadIsComplete(updated.squads[m.id] || [], countsFor(updated, m.id)));
  if (allFull) {
    const teamIds = updated.players.map((p) => p.id);
    return { ...updated, status: "league", currentLot: null, fixtures: generateFixtures(teamIds) };
  }
  let pool = updated.pool;
  let nextIndex = room.lotIndex + 1;
  if (nextIndex >= pool.length) {
    if (updated.unsoldIds.length > 0) {
      pool = [...pool, ...shuffle(updated.unsoldIds)];
      updated = { ...updated, unsoldIds: [] };
    } else {
      updated = forceFillIncompleteSquads(updated);
      const teamIds = updated.players.map((p) => p.id);
      return { ...updated, status: "league", currentLot: null, fixtures: generateFixtures(teamIds) };
    }
  }
  const nextPlayerId = pool[nextIndex];
  return { ...updated, pool, lotIndex: nextIndex, currentLot: makeLot(nextPlayerId, nextIndex + 1) };

// Host-only "skip the rest of this position category" — resolves the
// currently-open lot exactly as normal first (sold to whoever's leading,
// else unsold; never voids an active bid), then fast-forwards past every
// remaining lot of that same position straight to the first lot of the
// next category. Skipped players aren't lost — they go into the unsold
// pile, so they still get recycled near the end if the auction would
// otherwise run dry before every squad is full.
function skipCurrentPhase(room) {
  if (!room.currentLot) return room;
  let updated = resolveLot(room);
  const skippedPos = PLAYERS_BY_ID[room.currentLot.footballerId].position;
  let idx = room.lotIndex + 1;
  const skipped = [];
  while (idx < room.pool.length && PLAYERS_BY_ID[room.pool[idx]].position === skippedPos) {
    skipped.push(room.pool[idx]);
    idx++;
  }
  updated = { ...updated, unsoldIds: [...updated.unsoldIds, ...skipped] };
  const allFull = updated.players.every((m) => squadIsComplete(updated.squads[m.id] || [], countsFor(updated, m.id)));
  // Skipping the LAST category (forwards) with nothing left in the pool
  // has to actually reach League, full stop — recycling the just-skipped
  // players back in as more lots would mean clicking "Skip to League"
  // just kept the auction going, which looks exactly like the button
  // doing nothing. Force-fill whatever's still short instead of
  // re-offering what was just explicitly skipped.
  const isLastPhase = AUCTION_POSITION_ORDER.indexOf(skippedPos) === AUCTION_POSITION_ORDER.length - 1;
  if (allFull || (isLastPhase && idx >= room.pool.length)) {
    if (!allFull) updated = forceFillIncompleteSquads(updated);
    const teamIds = updated.players.map((p) => p.id);
    return { ...updated, status: "league", currentLot: null, fixtures: generateFixtures(teamIds) };
  }
  let pool = room.pool;
  if (idx >= pool.length) {
    // Not the last phase — pool is just temporarily short for a position
    // that still needs filling later, so recycling unsold/skipped players
    // back in is the right call here (unlike the last-phase case above).
    pool = [...pool, ...shuffle(updated.unsoldIds)];
    updated = { ...updated, unsoldIds: [] };

  const nextPlayerId = pool[idx];
  return { ...updated, pool, lotIndex: idx, currentLot: makeLot(nextPlayerId, idx + 1) };
}

  if (!lot) return false;
  const player = PLAYERS_BY_ID[lot.footballerId];
  const askAmount = nextBidAmount(lot.currentBid, lot.basePrice);
  const eligible = room.players.filter((m) =>
    !lot.passed.includes(m.id) &&
    m.id !== lot.currentBidderId &&
    canBid(room.squads[m.id] || [], room.remainingBudget[m.id] || 0, player, askAmount, countsFor(room, m.id))
  );
  if (lot.currentBidderId) {
    if (eligible.length === 0) return true;
  } else if (eligible.length === 0) {
    return true;
  }
  if (Date.now() >= lot.deadlineTs) return true;
  return false;
}

}
// A pitch-diagram view of a squad, grouped into rows by position (FWD at
// the top nearest "goal", GK at the bottom). Tapping two players in the
// SAME row swaps their left-right slot — purely a per-viewer display
// preference (never touches room state or the match engine, which only
// ever cares about each line's aggregate rating, not slot order), so it
// resets on reload and isn't synced to anyone else.
function FormationPitch({ squad }) {
  const byPos = useMemo(() => {
    const g = { GK: [], DEF: [], MID: [], FWD: [] };
    squad.forEach((p) => g[p.position].push(p));
    return g;
  }, [squad]);
  const [order, setOrder] = useState(() => ({
    GK: byPos.GK.map((p) => p.id), DEF: byPos.DEF.map((p) => p.id),
    MID: byPos.MID.map((p) => p.id), FWD: byPos.FWD.map((p) => p.id),
  }));
  const squadKey = squad.map((p) => p.id).join(",");
  useEffect(() => {
    setOrder({
      GK: byPos.GK.map((p) => p.id), DEF: byPos.DEF.map((p) => p.id),
      MID: byPos.MID.map((p) => p.id), FWD: byPos.FWD.map((p) => p.id),
    });
    // eslint-disable-next-line
  }, [squadKey]);
  const [selected, setSelected] = useState(null);
  const byId = useMemo(() => { const m = {}; squad.forEach((p) => (m[p.id] = p)); return m; }, [squad]);

  const swap = (pos, id) => {
    if (selected && selected.pos === pos && selected.id !== id) {
      setOrder((o) => {
        const arr = [...o[pos]];
        const i1 = arr.indexOf(selected.id), i2 = arr.indexOf(id);
        [arr[i1], arr[i2]] = [arr[i2], arr[i1]];
        return { ...o, [pos]: arr };
      });
      setSelected(null);
    } else {
      setSelected({ pos, id });
    }
  };

  const Row = ({ pos }) => (
    <div className="flex justify-center gap-4">
      {(order[pos] || []).map((id) => {
        const p = byId[id];
        if (!p) return null;
        const isSel = selected && selected.pos === pos && selected.id === id;
        return (
          <button key={id} onClick={() => swap(pos, id)}
            className="flex flex-col items-center gap-1 transition active:scale-95" title="Tap another player in this row to swap slots">
            <div className={`rounded-full ${isSel ? "ring-2 ring-offset-2" : ""}`} style={isSel ? { boxShadow: "0 0 0 2px #E8B23D", borderRadius: "9999px" } : undefined}>
              <PlayerPhoto player={p} size={46} rounded />
            </div>
            <span className="text-[9px] font-bold max-w-[62px] truncate text-white" style={{ textShadow: "0 1px 2px rgba(0,0,0,0.8)" }}>{p.name.split(" ").pop()}</span>
          </button>
        );
      })}
    </div>
  );

  return (
    <div style={{ background: "radial-gradient(ellipse at center, #0f5a34, #0a3d24)" }} className="rounded-xl p-4 relative overflow-hidden">
      <div style={{ position: "absolute", inset: 10, border: "2px solid rgba(255,255,255,0.18)", borderRadius: 10 }} />
      <div style={{ position: "absolute", left: "50%", top: 10, bottom: 10, width: 2, background: "rgba(255,255,255,0.18)", transform: "translateX(-50%)" }} />
      <div style={{ position: "absolute", left: "50%", top: "50%", width: 70, height: 70, border: "2px solid rgba(255,255,255,0.18)", borderRadius: "50%", transform: "translate(-50%,-50%)" }} />
      <div className="relative flex flex-col gap-5 py-3">
        <Row pos="FWD" /><Row pos="MID" /><Row pos="DEF" /><Row pos="GK" />
      </div>
      <div className="relative text-center text-[10px] opacity-70 mt-2">Tap two players in the same row to swap their slots</div>
    </div>
  );
}
function CountdownBar({ deadlineTs, now }) {
  const total = LOT_DURATION_MS;
  const left = Math.max(0, deadlineTs - now);
  const pct = Math.max(0, Math.min(100, (left / total) * 100));
  const color = pct > 50 ? "#3FA796" : pct > 20 ? "#E8B23D" : "#D64545";
  return (
    <div className={`w-full h-2.5 rounded-full overflow-hidden ${pct <= 20 ? "pal-pulse-red" : ""}`} style={{ background: "#151E30" }}>
      <div style={{ width: `${pct}%`, background: color, transition: "width 0.2s linear" }} className="h-full" />
    </div>
  );
}

                const buyer = entry.buyerId ? room.players.find((m) => m.id === entry.buyerId) : null;
                const isSteal = buyer && entry.price <= p.basePrice * 1.15;
                const isBigSpend = buyer && entry.price >= p.basePrice * 2;

                  <div key={i} className="flex items-center justify-between text-xs bg-white/[0.03] rounded-lg px-3 py-1.5">

                    </span>
                    {buyer ? (
                      <span className="font-mono font-bold shrink-0 pl-2" style={{ color: "#3FA796" }}>{fmtM(entry.price)} → {buyer.name}</span>

                      <span className="font-mono font-bold opacity-40 shrink-0 pl-2">UNSOLD</span>

        <div className="flex flex-col gap-2 max-h-[75vh] overflow-y-auto pr-1">

            <ManagerCard key={m.id} manager={m} squad={room.squads[m.id] || []} budget={room.remainingBudget[m.id] || 0}

      </div>
      {viewingManager && (
        <SquadModal manager={viewingManager} squad={room.squads[viewingManager.id] || []} counts={countsFor(room, viewingManager.id)}

  );

// While a fixture is within LIVE_MATCH_MS of its stored liveStartedAt,
// every viewer independently computes the same "current minute" from
// elapsed time against that shared timestamp and reveals goals as their
// minute is reached — no server push needed, and anyone who opens the
// fixture mid-match sees it at the correct live minute, not from the
// start. Once elapsed time passes LIVE_MATCH_MS it just renders the
// final state, same as before this feature existed.
function FixtureRow({ fixture, room, onSimulate, now }) {
  const home = room.players.find((m) => m.id === fixture.home);
  const away = room.players.find((m) => m.id === fixture.away);
  const [open, setOpen] = useState(false);

  const elapsedMs = fixture.liveStartedAt != null ? now - fixture.liveStartedAt : null;
  const isLive = fixture.played && elapsedMs != null && elapsedMs < LIVE_MATCH_MS;
  const liveMinute = isLive ? Math.min(90, Math.max(0, Math.floor(elapsedMs / MS_PER_GAME_MINUTE))) : null;
  const allScorers = fixture.scorers || [];
  const visibleScorers = isLive ? allScorers.filter((s) => s.minute <= liveMinute) : allScorers;
  const homeGoalsShown = isLive ? visibleScorers.filter((s) => s.side === "home").length : fixture.homeGoals;
  const awayGoalsShown = isLive ? visibleScorers.filter((s) => s.side === "away").length : fixture.awayGoals;

  return (
    <div className="bg-white/[0.03] rounded-lg px-3 py-2">
      <div className="flex items-center gap-2 text-sm">
        <span className="flex-1 text-right font-semibold truncate">{home?.name}</span>

          <button onClick={() => !isLive && setOpen((o) => !o)} className="font-mono font-black px-2 flex items-center gap-1.5" style={{ color: "#E8B23D" }}>
            {isLive && <span className="w-1.5 h-1.5 rounded-full pal-pulse" style={{ background: "#D64545" }} />}
            {homeGoalsShown} - {awayGoalsShown}
          </button>
        ) : (
          <span className="opacity-40 font-mono px-2">vs</span>
        )}
        <span className="flex-1 truncate">{away?.name}</span>
        {!fixture.played && (
          <button onClick={() => onSimulate(fixture.id)} style={{ background: "#3FA796" }} className="text-[#0A0F1A] text-xs font-bold px-3 py-1 rounded-lg active:scale-95">
            Simulate
          </button>
        )}
        {isLive && <span className="font-mono text-[10px] font-bold shrink-0" style={{ color: "#D64545" }}>{liveMinute}'</span>}
      </div>
      {isLive ? (
        <div className="flex flex-col gap-0.5 mt-1 pl-1 text-[10px]">
          {visibleScorers.length === 0 && <span className="opacity-50 italic">Kick-off…</span>}
          {visibleScorers.map((s, i) => (
            <span key={i} className={i === visibleScorers.length - 1 ? "font-bold opacity-100" : "opacity-55"}>
              ⚽ {s.minute}' {s.name} <span className="opacity-70">({s.side === "home" ? home?.name : away?.name})</span>
            </span>
          ))}
        </div>
      ) : (
        <>
          {fixture.played && allScorers.length > 0 && (
            <div className="flex flex-wrap gap-x-3 gap-y-0.5 mt-1 pl-1 text-[10px] opacity-70">
              {allScorers.map((s, i) => (
                <span key={i}>⚽ {s.minute}' {s.name} <span className="opacity-50">({s.side === "home" ? home?.name : away?.name})</span></span>
              ))}
            </div>
          )}
          {fixture.played && allScorers.length === 0 && (
            <div className="text-[10px] opacity-40 mt-1 pl-1">A goalless draw — both defenses held firm.</div>
          )}
        </>
      )}
      {open && fixture.played && !isLive && (
        <div className="mt-2 pl-2 border-l-2 border-white/10 flex flex-col gap-0.5 text-[11px] opacity-70">
          {fixture.log.map((l, i) => <div key={i}>{l}</div>)}

  );

function PremAuctionLeague() {
  const [myId] = useState(() => {
    let id = localStorage.getItem(PERSONAL_ID_KEY);
    if (!id) { id = genId(); localStorage.setItem(PERSONAL_ID_KEY, id); }
    return id;
  });
  const [code, setCode] = useState(() => localStorage.getItem(ACTIVE_ROOM_KEY) || null);
  const [room, setRoom] = useState(null);
  const [closedMessage, setClosedMessage] = useState(null);
  const [now, setNow] = useState(Date.now());
  const roomRef = useRef(null);
  roomRef.current = room;
  const resolvingRef = useRef(false);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 250);
    return () => clearInterval(t);
  }, []);

  // Poll shared room state — also fires immediately the instant the tab
  // regains visibility. Browsers throttle setInterval hard while a tab is
  // backgrounded (phone locked, tab switched, laptop asleep — Chrome can
  // drop to roughly once a minute after a few minutes hidden), so without
  // this, state can sit stale until the interval happens to catch up. If
  // every connected player's tab is backgrounded at once, nothing in the
  // game advances at all until someone looks back — this is what "the
  // server gets stuck" actually was, since all game logic runs
  // client-side on these timers, not on the server.
  useEffect(() => {
    if (!code) return;
    let alive = true;
    const tick = async () => {
      const { deleted, value } = await fetchRoomStatus(roomKey(code));
      if (!alive) return;
      if (deleted) {
        // Confirmed gone (not just a network blip) — the host closed it.
        // Bounce everyone else back to the home screen with an explanation
        // instead of leaving their UI frozen on stale state forever.
        setClosedMessage("This room was closed by the host.");
        localStorage.removeItem(ACTIVE_ROOM_KEY);
        setCode(null);
        setRoom(null);
        return;
      }
      if (value) setRoom(value);
    };
    tick();
    const t = setInterval(tick, 800);
    const onVisible = () => { if (document.visibilityState === "visible") tick(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => { alive = false; clearInterval(t); document.removeEventListener("visibilitychange", onVisible); };
  }, [code]);

  // Auto-resolve auction lots (timer/pass-out) and drive AI bidding — any
  // connected tab can do this, guarded by rev so concurrent writers never
  // corrupt state; a losing write just gets picked up fresh next tick.
  // Runs on its own fixed interval rather than depending on `room`/`now`
  // (both of which change every ~250ms from the countdown re-render) —
  // depending on those would tear down and reschedule this tick before it
  // ever got a chance to fire.
  useEffect(() => {
    if (!code || !room || room.status !== "auction") return;
    const run = async () => {
      if (resolvingRef.current) return;
      const fresh = roomRef.current;
      if (!fresh || fresh.status !== "auction" || !fresh.currentLot) return;
      if (lotShouldResolve(fresh)) {
        resolvingRef.current = true;
        try {
          const updated = advanceAuction(fresh);
          await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
        } finally {
          resolvingRef.current = false;
        }
        return;
      }
      const lot = fresh.currentLot;
      const player = PLAYERS_BY_ID[lot.footballerId];
      const aiCandidates = fresh.players.filter((m) => m.isAI && m.id !== lot.currentBidderId && !lot.passed.includes(m.id));
      for (const ai of aiCandidates) {
        const squad = fresh.squads[ai.id] || [];
        const budget = fresh.remainingBudget[ai.id] || 0;
        const decision = aiDecision(ai, squad, budget, player, lot.currentBid, lot.basePrice, countsFor(fresh, ai.id));
        if (decision != null) {
          const updated = { ...fresh, currentLot: { ...lot, currentBid: decision, currentBidderId: ai.id, deadlineTs: Date.now() + LOT_DURATION_MS, passed: lot.passed.filter((id) => id !== ai.id), raiseCount: (lot.raiseCount || 0) + 1 } };
          await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
        } else if (!lot.passed.includes(ai.id)) {
          const updated = { ...fresh, currentLot: { ...lot, passed: [...lot.passed, ai.id] } };
          await commitIfRevMatches(roomKey(code), fresh, { ...updated, rev: fresh.rev + 1 });
        }
        break; // one AI action per tick keeps writes serialized & readable
      }
    };
    const t = setInterval(run, 700);
    const onVisible = () => { if (document.visibilityState === "visible") run(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => { clearInterval(t); document.removeEventListener("visibilitychange", onVisible); };
  }, [code, room && room.status]);

  // Applies compute(fresh) -> updated against the room, retrying against a
  // freshly re-read room on a 409 conflict rather than giving up silently.
  // A silent failure used to leave the optimistic setRoom() from the first
  // attempt on screen even though the server rejected it — invisible until
  // the next poll quietly reverted it, which is what read as "lag" once
  // the atomic CAS fix (necessarily) started rejecting losing writers
  // instead of letting them silently corrupt the room. compute() returning
  // a falsy value aborts (e.g. the fresh state made the action invalid).
  const commitWithRetry = async (key, compute, maxAttempts = 6) => {
    let fresh = roomRef.current;
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      if (!fresh) return null;
      const updated = compute(fresh);
      if (!updated) return null;
      const withRev = { ...updated, rev: fresh.rev + 1 };
      setRoom(withRev);
      const result = await casWrite(key, withRev, fresh.rev);
      if (result.ok) return withRev;
      if (result.currentValue) {
        fresh = result.currentValue; // free — came back on the 409 itself
      } else {
        await new Promise((r) => setTimeout(r, 50 + Math.random() * 90));
        fresh = await storageGet(key);
      }
    }
    return null;
  };

  const persistActiveRoom = (c) => {
    if (c) localStorage.setItem(ACTIVE_ROOM_KEY, c); else localStorage.removeItem(ACTIVE_ROOM_KEY);
  };

  const createRoom = async (name) => {
    localStorage.setItem(PERSONAL_NAME_KEY, name);
    const newCode = genCode();
    const me = { id: myId, name, isAI: false, colorIdx: 0 };
    const startingBudget = 380;
    const initial = {
      code: newCode, rev: 1, status: "lobby", hostId: myId, budget: startingBudget,
      players: [me], squads: { [myId]: [] }, remainingBudget: { [myId]: startingBudget },
      formations: { [myId]: DEFAULT_FORMATION },
      pool: [], lotIndex: -1, currentLot: null, soldLog: [], unsoldIds: [],
      fixtures: [],
    };
    await storageSet(roomKey(newCode), initial);
    persistActiveRoom(newCode);
    setCode(newCode);
    setRoom(initial);
  };

  // Retries on a genuine rev conflict (two people joining in the same
  // instant) rather than surfacing it as an error — the atomic CAS on the
  // server guarantees at most one writer wins each attempt, so re-reading
  // the just-updated room and trying again immediately resolves it; a
  // human shouldn't have to notice a collision happened at all.
  const joinRoom = async (joinCode, name) => {
    localStorage.setItem(PERSONAL_NAME_KEY, name);
    for (let attempt = 0; attempt < 5; attempt++) {
      const existing = await storageGet(roomKey(joinCode));
      if (!existing || existing.status !== "lobby") return false;
      if (existing.players.some((p) => p.id === myId)) {
        persistActiveRoom(joinCode); setCode(joinCode); setRoom(existing); return true;
      }
      if (existing.players.length >= 10) return false;
      const me = { id: myId, name, isAI: false, colorIdx: existing.players.length };
      const updated = {
        ...existing, rev: existing.rev + 1,
        players: [...existing.players, me],
        squads: { ...existing.squads, [myId]: [] },
        remainingBudget: { ...existing.remainingBudget, [myId]: existing.budget },
        formations: { ...existing.formations, [myId]: DEFAULT_FORMATION },
      };
      const ok = await commitIfRevMatches(roomKey(joinCode), existing, updated);
      if (ok) {
        persistActiveRoom(joinCode); setCode(joinCode); setRoom(updated);
        return true;
      }
      // Conflict — someone else wrote to the room between our read and
      // write. Brief jittered backoff so simultaneous joiners don't just
      // collide again on the next attempt, then retry from a fresh read.
      await new Promise((r) => setTimeout(r, 80 + Math.random() * 120));
    }
    return false;
  };

  const updateBudget = async (budget) => {
    await commitWithRetry(roomKey(code), (fresh) => {
      const remainingBudget = {};
      fresh.players.forEach((p) => (remainingBudget[p.id] = budget));
      return { ...fresh, budget, remainingBudget };
    });
  };

  const setFormation = async (formationKey) => {
    await commitWithRetry(roomKey(code), (fresh) => ({ ...fresh, formations: { ...fresh.formations, [myId]: formationKey } }));
  };

  const startAuction = async () => {
    await commitWithRetry(roomKey(code), (fresh) => {
      let players = fresh.players;
      let squads = { ...fresh.squads };
      let remainingBudget = { ...fresh.remainingBudget };
      let formations = { ...fresh.formations };
      if (players.length < 2) {
        const bot = { id: "AI_" + genId(), name: AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)], isAI: true, colorIdx: players.length };
        players = [...players, bot];
        squads[bot.id] = [];
        remainingBudget[bot.id] = fresh.budget;
        formations[bot.id] = randomFormationKey();
      }
      const pool = buildAuctionPool();
      return {
        ...fresh, players, squads, remainingBudget, formations, status: "auction",
        pool, lotIndex: 0, currentLot: makeLot(pool[0], 1), soldLog: [], unsoldIds: [],
      };
    });
  };

  // Retries against a fresh read on conflict — with several people
  // bidding on the same lot in the same few hundred milliseconds, a
  // rev conflict here is routine, not exceptional, so it has to recover
  // by itself rather than leave a rejected optimistic bid on screen.
  const placeBid = async (amount) => {
    await commitWithRetry(roomKey(code), (fresh) => {
      if (!fresh.currentLot) return null;
      const lot = fresh.currentLot;
      const player = PLAYERS_BY_ID[lot.footballerId];
      const squad = fresh.squads[myId] || [];
      const budget = fresh.remainingBudget[myId] || 0;
      // Re-validated against whatever's actually current on each retry —
      // e.g. if the lot resolved/advanced between attempts, canBid runs
      // against the NEW lot's player, not a stale one, and correctly
      // aborts if that no longer makes sense (position filled elsewhere,
      // budget moved, etc.) rather than blindly reapplying an old bid.
      if (!canBid(squad, budget, player, amount, countsFor(fresh, myId))) return null;
      return { ...fresh, currentLot: { ...lot, currentBid: amount, currentBidderId: myId, deadlineTs: Date.now() + LOT_DURATION_MS, passed: lot.passed.filter((id) => id !== myId), raiseCount: (lot.raiseCount || 0) + 1 } };
    });
  };
  const passLot = async () => {
    await commitWithRetry(roomKey(code), (fresh) => {
      if (!fresh.currentLot) return null;
      const lot = fresh.currentLot;
      if (lot.passed.includes(myId)) return null;
      return { ...fresh, currentLot: { ...lot, passed: [...lot.passed, myId] } };
    });
  };
  // Host-only: skip the rest of the current position category.
  const skipPhase = async () => {
    await commitWithRetry(roomKey(code), (fresh) => {
      if (fresh.hostId !== myId || !fresh.currentLot) return null;
      return skipCurrentPhase(fresh);
    });
  };

  const simulateOne = async (fixtureId) => {
    await commitWithRetry(roomKey(code), (fresh) => {
      const fixture = fresh.fixtures.find((f) => f.id === fixtureId);
      if (!fixture || fixture.played) return null;
      const homeM = fresh.players.find((m) => m.id === fixture.home);
      const awayM = fresh.players.find((m) => m.id === fixture.away);
      const result = simulateFixture(fresh.squads[fixture.home] || [], fresh.squads[fixture.away] || [], homeM.name, awayM.name,
        fresh.formations[fixture.home], fresh.formations[fixture.away]);
      const liveStartedAt = Date.now();
      const fixtures = fresh.fixtures.map((f) => f.id === fixtureId ? { ...f, played: true, homeGoals: result.homeGoals, awayGoals: result.awayGoals, log: result.log, scorers: result.scorers, liveStartedAt } : f);
      return { ...fresh, fixtures };
    });
  };
  const simulateAll = async () => {
    await commitWithRetry(roomKey(code), (fresh) => {
      // Same start timestamp for every fixture in this batch — a full
      // round kicking off together, same as real matchdays, and it means
      // several live tickers animate in parallel rather than staggered.
      const liveStartedAt = Date.now();
      const fixtures = fresh.fixtures.map((f) => {
        if (f.played) return f;
        const homeM = fresh.players.find((m) => m.id === f.home);
        const awayM = fresh.players.find((m) => m.id === f.away);
        const result = simulateFixture(fresh.squads[f.home] || [], fresh.squads[f.away] || [], homeM.name, awayM.name,
          fresh.formations[f.home], fresh.formations[f.away]);
        return { ...f, played: true, homeGoals: result.homeGoals, awayGoals: result.awayGoals, log: result.log, scorers: result.scorers, liveStartedAt };
      });
      return { ...fresh, fixtures };
    });
  };

  const playAgain = async () => {
    await commitWithRetry(roomKey(code), (fresh) => {
      const squads = {}; const remainingBudget = {};
      fresh.players.forEach((p) => { squads[p.id] = []; remainingBudget[p.id] = fresh.budget; });
      return { ...fresh, status: "lobby", squads, remainingBudget, pool: [], lotIndex: -1, currentLot: null, soldLog: [], unsoldIds: [], fixtures: [] };
    });
  };

  const leaveRoom = () => { persistActiveRoom(null); setCode(null); setRoom(null); };
  // Host-only: ends the room for everyone, not just this tab. Every other
  // connected client's poll picks up the deletion within one tick (or
  // instantly on visibility regain) and gets bounced to the home screen
  // with an explanation, rather than being left staring at a dead room.
  const closeRoom = async () => {
    const fresh = roomRef.current;
    if (!fresh || fresh.hostId !== myId) return;
    await storageDelete(roomKey(code));
    persistActiveRoom(null); setCode(null); setRoom(null);
  };

  if (!code || !room) {
    return <div key="home" className="pal-fade-in h-full"><HomeScreen onCreate={createRoom} onJoin={joinRoom} closedMessage={closedMessage} onDismissClosedMessage={() => setClosedMessage(null)} /></div>;
  }
  if (room.status === "lobby") {
    return <div key="lobby" className="pal-fade-in h-full"><LobbyScreen room={room} myId={myId} onUpdateBudget={updateBudget} onSetFormation={setFormation} onStart={startAuction} onLeave={leaveRoom} onCloseRoom={closeRoom} /></div>;
  }
  if (room.status === "auction") {
    return <div key="auction" className="pal-fade-in h-full"><AuctionScreen room={room} myId={myId} onBid={placeBid} onPass={passLot} onSkipPhase={skipPhase} onCloseRoom={closeRoom} now={now} /></div>;
  }
  if (room.status === "league") {
    return <div key="league" className="pal-fade-in h-full"><LeagueScreen room={room} myId={myId} onSimulate={simulateOne} onSimulateAll={simulateAll} onPlayAgain={playAgain} onCloseRoom={closeRoom} now={now} /></div>;
  }
  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PremAuctionLeague />);
</script>
<script>
  // Babel Standalone's default "react" preset now targets the automatic
  // JSX runtime (imports from "react/jsx-runtime"), which doesn't exist
  // as a global when using the classic React/ReactDOM UMD builds above.
  // Transform manually with the classic runtime so JSX compiles to
  // React.createElement calls against the global `React`.
  (function () {
    const source = document.getElementById("app-source").textContent;
    try {
      const { code } = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      });
      (0, eval)(code);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<pre style="color:#D64545;background:#070C16;padding:16px;white-space:pre-wrap;">App failed to start:\n' +
        (e && e.message ? e.message : String(e)) +
        "</pre>";
      console.error(e);
    }
  })();
</script>
</body>
